[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reclaimit"
version = "0.1.0"
description = "TUI client for bidirectional iOS media sync on Linux and Unix-like systems"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Reclaimit contributors" }]
dependencies = [
  "cffi>=1.17",
  "pydantic>=2.10",
  "rich>=13.9",
  "typer>=0.12",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.8",
]
tui = [
  "textual>=1.0",
]

[project.scripts]
reclaimit = "reclaimit.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

